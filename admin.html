<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEG-FORMS Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0a0e1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-0:#0a0e1a; --bg-1:#0f1526; --card:#151d35; --card-hover:#1b2440;
    --border:rgba(94,150,255,0.16); --border-strong:rgba(94,150,255,0.35);
    --text-1:#eaf0ff; --text-2:#8b9bc4; --text-3:#5a6890;
    --accent:#4fd8c4; --accent-2:#5e96ff; --accent-purple:#a78bfa; --accent-amber:#f5b94f;
    --glow-blue: 0 0 24px rgba(94,150,255,0.3);
    --font:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  [data-theme="light"]{
    --bg-0:#eef2fa; --bg-1:#f5f8fd; --card:#ffffff; --card-hover:#f0f5ff;
    --border:rgba(30,60,120,0.10); --border-strong:rgba(30,60,120,0.22);
    --text-1:#132043; --text-2:#54628c; --text-3:#8b96b8;
    --accent:#0d9488; --accent-2:#2563eb; --accent-purple:#7c3aed; --accent-amber:#d97706;
    --glow-blue: 0 4px 20px rgba(37,99,235,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg-0);color:var(--text-1);min-height:100vh;transition:background .3s,color .3s;}

  #authOverlay{position:fixed;inset:0;background:var(--bg-0);z-index:2000;display:flex;align-items:center;justify-content:center;}
  .auth-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;max-width:90vw;box-shadow:var(--glow-blue);}
  .auth-box h2{margin:0 0 4px;color:var(--accent);font-size:20px;}
  .auth-box .sub{color:var(--text-2);font-size:12.5px;margin-bottom:18px;}
  .auth-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-1);color:var(--text-1);font-size:14px;box-sizing:border-box;}
  .auth-box button{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;font-weight:700;cursor:pointer;font-family:var(--font);}
  .auth-error{color:#f87171;font-size:12px;margin-bottom:8px;min-height:16px;}

  #appShell{display:none;min-height:100vh;}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);}
  .topbar .logo{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;}
  .topbar .logo img{width:100%;height:100%;object-fit:contain;}
  .topbar .title{font-weight:700;font-size:15px;}
  .topbar .sub{font-size:11px;color:var(--text-2);}
  .topbar .spacer{flex:1;}
  .topbar a{color:var(--text-2);text-decoration:none;font-size:12.5px;margin-right:14px;}
  .theme-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--bg-1);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--text-2);}
  .topbar button{background:transparent;border:1px solid var(--border);color:var(--text-2);font-size:11px;padding:5px 12px;border-radius:999px;cursor:pointer;margin-left:8px;}

  .layout{display:flex;min-height:calc(100vh - 57px);}
  .sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:16px 10px;}
  .sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:4px;}
  .sidebar-item:hover{background:var(--card-hover);}
  .sidebar-item.active{background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;}

  .main{flex:1;padding:22px 28px;overflow-x:auto;}
  .main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .main-title{font-size:20px;font-weight:700;}
  .main-sub{font-size:12.5px;color:var(--text-2);margin-top:2px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters input, .filters select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-1);color:var(--text-1);font-size:12.5px;font-family:var(--font);}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-1);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);}
  .btn.primary{background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;border:none;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden;}
  table.data-table th{text-align:left;padding:10px 12px;background:var(--bg-1);color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  table.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table tr.clickable{cursor:pointer;}
  table.data-table tr.clickable:hover{background:var(--card-hover);}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;}
  .status-draft{background:rgba(139,155,196,0.2);color:var(--text-2);}
  .status-submitted{background:rgba(245,185,79,0.2);color:var(--accent-amber);}
  .status-approved{background:rgba(79,216,196,0.2);color:var(--accent);}
  .form-badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .form-badge.scf{background:rgba(79,216,196,0.15);color:var(--accent);}
  .form-badge.otcf{background:rgba(94,150,255,0.15);color:var(--accent-2);}
  .empty-note{text-align:center;padding:40px;color:var(--text-2);font-size:13px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;align-items:center;justify-content:center;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:600px;max-width:92vw;max-height:82vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 14px;color:var(--accent);}
  .modal-close{float:right;cursor:pointer;color:var(--text-2);font-size:18px;}
  .detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{color:var(--text-2);}
  .line-items-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
  .line-items-table th,.line-items-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
</style>
</head>
<body data-theme="dark">

<div id="authOverlay">
  <div class="auth-box">
    <h2>MEG-FORMS Admin</h2>
    <div class="sub">Sign in with an admin account to continue</div>
    <div class="auth-error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="doSignIn()">Sign In</button>
  </div>
</div>

<div id="appShell">
  <div class="topbar">
    <div class="logo"><img id="logoImg" src=""></div>
    <div>
      <div class="title">MEG-FORMS Admin</div>
      <div class="sub">Cross-form submissions</div>
    </div>
    <div class="spacer"></div>
    <a href="https://myedengp01.github.io/DB-MEG-FORMS/">← Back to Dashboard</a>
    <div class="theme-toggle" onclick="toggleTheme()"><span id="themeLabel">Dark</span> 🌙</div>
    <button onclick="doSignOut()">Sign Out</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-item active" data-scope="all" onclick="selectScope('all')">📊 All Submissions</div>
      <div id="sidebarFormItems"></div>
    </div>

    <div class="main">
      <div class="main-header">
        <div>
          <div class="main-title" id="mainTitle">All Submissions</div>
          <div class="main-sub" id="mainSub">Loading...</div>
        </div>
        <button class="btn primary" onclick="exportCsv()">⬇️ Export CSV</button>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search claimant name..." oninput="applyFilters()">
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="submitted">Submitted</option>
          <option value="approved">Approved</option>
        </select>
        <input type="date" id="dateFrom" onchange="applyFilters()">
        <span style="color:var(--text-2);font-size:12px;">to</span>
        <input type="date" id="dateTo" onchange="applyFilters()">
        <button class="btn" onclick="clearFilters()">Clear</button>
      </div>

      <div id="tableWrap"><div class="empty-note">Loading submissions...</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeDetailModal()">✕</span>
    <h3 id="detailTitle">Submission Detail</h3>
    <div id="detailContent"></div>
  </div>
</div>

let currentUser = null, adminFormCodes = [], allRows = [], filteredRows = [], currentScope = 'all';

function toggleTheme(){
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
  localStorage.setItem('meg_forms_theme', isDark ? 'light' : 'dark');
}
function applyStoredTheme(){
  if(localStorage.getItem('meg_forms_theme') === 'light'){
    document.body.setAttribute('data-theme','light');
    document.getElementById('themeLabel').textContent = 'Light';
  }
}

async function doSignIn(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; return; }
  await init();
}
async function doSignOut(){
  await sb.auth.signOut();
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

async function init(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return; }
  currentUser = user;

  const { data: perms } = await sb.from('form_permissions').select('form_code').eq('user_id', user.id).eq('is_admin', true);
  adminFormCodes = (perms||[]).map(p=>p.form_code);

  if(adminFormCodes.length === 0){
    document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('loginError').textContent = 'This account has no admin access on any form.';
    await sb.auth.signOut();
    return;
  }

  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';

  const { data: registry } = await sb.from('form_registry').select('*').in('form_code', adminFormCodes).order('sort_order');
  const sidebarEl = document.getElementById('sidebarFormItems');
  sidebarEl.innerHTML = (registry||[]).map(f=>
    `<div class="sidebar-item" data-scope="${f.form_code}" onclick="selectScope('${f.form_code}')">${f.icon||'📄'} ${escapeHtmlAdmin(f.display_name)}</div>`
  ).join('');

  await loadSubmissions();
}

async function loadSubmissions(){
  document.getElementById('tableWrap').innerHTML = '<div class="empty-note">Loading submissions...</div>';
  const { data, error } = await sb.from('all_submissions_view').select('*').order('submitted_at', { ascending:false, nullsFirst:false });
  if(error){
    console.error(error);
    document.getElementById('tableWrap').innerHTML = '<div class="empty-note">Failed to load submissions.</div>';
    return;
  }
  allRows = (data||[]).filter(r => adminFormCodes.includes(r.form_code));
  applyFilters();
}

function selectScope(scope){
  currentScope = scope;
  document.querySelectorAll('.sidebar-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.scope === scope);
  });
  document.getElementById('mainTitle').textContent = scope==='all' ? 'All Submissions' : (document.querySelector(`.sidebar-item[data-scope="${scope}"]`)?.textContent.trim() || scope);
  applyFilters();
}

function applyFilters(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;

  filteredRows = allRows.filter(r=>{
    if(currentScope !== 'all' && r.form_code !== currentScope) return false;
    if(search && !(r.claimant_name||'').toLowerCase().includes(search)) return false;
    if(status && r.status !== status) return false;
    if(from && (!r.submitted_at || r.submitted_at.slice(0,10) < from)) return false;
    if(to && (!r.submitted_at || r.submitted_at.slice(0,10) > to)) return false;
    return true;
  });

  document.getElementById('mainSub').textContent = `${filteredRows.length} submission${filteredRows.length===1?'':'s'}`;
  renderTable();
}
function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  applyFilters();
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function fmtAmount(row){
  if(row.amount===null || row.amount===undefined) return '—';
  return row.amount_unit==='RM' ? `RM ${Number(row.amount).toFixed(2)}` : `${Number(row.amount)} hrs`;
}
function escapeHtmlAdmin(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTable(){
  const wrap = document.getElementById('tableWrap');
  if(filteredRows.length === 0){
    wrap.innerHTML = '<div class="empty-note">No submissions match the current filters.</div>';
    return;
  }
  wrap.innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Claimant</th><th>Form</th><th>Serial No.</th><th>Amount</th><th>Status</th>
        <th>Submitted</th><th>Approved</th><th>Approved By</th>
      </tr></thead>
      <tbody>
        ${filteredRows.map(r=>`
          <tr class="clickable" onclick="openDetailModal('${r.form_code}','${r.id}')">
            <td>${escapeHtmlAdmin(r.claimant_name)}</td>
            <td><span class="form-badge ${r.form_code}">${r.form_code.toUpperCase()}</span></td>
            <td>${escapeHtmlAdmin(r.serial_no)}</td>
            <td>${fmtAmount(r)}</td>
            <td><span class="status-pill status-${r.status}">${r.status.toUpperCase()}</span></td>
            <td>${fmtDate(r.submitted_at)}</td>
            <td>${fmtDate(r.approved_at)}</td>
            <td>${escapeHtmlAdmin(r.approved_by_name) || '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function openDetailModal(formCode, id){
  document.getElementById('detailModal').style.display = 'flex';
  document.getElementById('detailTitle').textContent = 'Loading...';
  document.getElementById('detailContent').innerHTML = '';
  const table = formCode==='scf' ? 'scf_submissions' : 'otcf_submissions';
  const { data, error } = await sb.from(table).select('*').eq('id', id).single();
  if(error || !data){ document.getElementById('detailContent').innerHTML = '<div class="empty-note">Failed to load detail.</div>'; return; }
  document.getElementById('detailTitle').textContent = `${formCode.toUpperCase()} — ${data.serial_no}`;

  let rows = '';
  if(formCode==='scf'){
    rows = `
      <div class="detail-row"><span class="detail-label">Claimed By</span><span>${escapeHtmlAdmin(data.claimed_by)}</span></div>
      <div class="detail-row"><span class="detail-label">Company</span><span>${escapeHtmlAdmin(data.company_code)}</span></div>
      <div class="detail-row"><span class="detail-label">Period</span><span>${escapeHtmlAdmin(data.period_from)} - ${escapeHtmlAdmin(data.period_to)} ${escapeHtmlAdmin(data.period_year)}</span></div>
      <div class="detail-row"><span class="detail-label">Payment Method</span><span>${escapeHtmlAdmin(data.payment_method)}</span></div>
      <div class="detail-row"><span class="detail-label">Bank</span><span>${escapeHtmlAdmin(data.bank_name)} - ${escapeHtmlAdmin(data.bank_account_no)}</span></div>
      <div class="detail-row"><span class="detail-label">Total</span><span>RM ${Number(data.total).toFixed(2)}</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="status-pill status-${data.status}">${data.status.toUpperCase()}</span></div>
      <table class="line-items-table">
        <thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Amount</th></tr></thead>
        <tbody>${(data.line_items||[]).map(li=>`<tr><td>${escapeHtmlAdmin(li.date)}</td><td>${escapeHtmlAdmin(li.supplier)}</td><td>${escapeHtmlAdmin(li.item)}</td><td>${Number(li.amount||0).toFixed(2)}</td></tr>`).join('')}</tbody>
      </table>`;
  } else {
    rows = `
      <div class="detail-row"><span class="detail-label">Employee</span><span>${escapeHtmlAdmin(data.emp_name)}</span></div>
      <div class="detail-row"><span class="detail-label">Department</span><span>${escapeHtmlAdmin(data.department)}</span></div>
      <div class="detail-row"><span class="detail-label">Designation</span><span>${escapeHtmlAdmin(data.designation)}</span></div>
      <div class="detail-row"><span class="detail-label">Month/Year</span><span>${data.month}/${data.year}</span></div>
      <div class="detail-row"><span class="detail-label">Total Hours</span><span>${data.total_hours} hrs</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="status-pill status-${data.status}">${data.status.toUpperCase()}</span></div>
      <div class="detail-row"><span class="detail-label">Approval Token</span><span>${escapeHtmlAdmin(data.approval_token) || '—'}</span></div>
      <table class="line-items-table">
        <thead><tr><th>Date</th><th>Day</th><th>Claim Type</th><th>From</th><th>To</th><th>Hrs</th></tr></thead>
        <tbody>${(data.line_items||[]).map(li=>`<tr><td>${escapeHtmlAdmin(li.date)}</td><td>${escapeHtmlAdmin(li.day)}</td><td>${escapeHtmlAdmin(li.claimType)}</td><td>${escapeHtmlAdmin(li.from)}</td><td>${escapeHtmlAdmin(li.to)}</td><td>${escapeHtmlAdmin(li.totalHrs)}</td></tr>`).join('')}</tbody>
      </table>`;
  }
  document.getElementById('detailContent').innerHTML = rows;
}
function closeDetailModal(){ document.getElementById('detailModal').style.display = 'none'; }

function exportCsv(){
  if(filteredRows.length === 0){ alert('No rows to export.'); return; }
  const headers = ['Claimant','Form','Serial No','Amount','Unit','Status','Submitted','Approved','Approved By'];
  const csvRows = [headers.join(',')];
  filteredRows.forEach(r=>{
    const row = [
      csvEscape(r.claimant_name), r.form_code.toUpperCase(), csvEscape(r.serial_no),
      r.amount ?? '', r.amount_unit, r.status, fmtDate(r.submitted_at), fmtDate(r.approved_at),
      csvEscape(r.approved_by_name || '')
    ];
    csvRows.push(row.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MEG-FORMS-Submissions-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function csvEscape(s){
  s = String(s||'');
  if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

window.onload = async function(){
  applyStoredTheme();
  document.getElementById('logoImg').src = MEG_LOGO_B64;
  const { data: { session } } = await sb.auth.getSession();
  if(session) await init();
};
