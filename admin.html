<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEG-FORMS Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0a0e1a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-0:#0a0e1a; --bg-1:#0f1526; --card:#151d35; --card-hover:#1b2440;
    --border:rgba(94,150,255,0.16); --border-strong:rgba(94,150,255,0.35);
    --text-1:#eaf0ff; --text-2:#8b9bc4; --text-3:#5a6890;
    --accent:#4fd8c4; --accent-2:#5e96ff; --accent-purple:#a78bfa; --accent-amber:#f5b94f;
    --glow-blue: 0 0 24px rgba(94,150,255,0.3);
    --font:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  [data-theme="light"]{
    --bg-0:#eef2fa; --bg-1:#f5f8fd; --card:#ffffff; --card-hover:#f0f5ff;
    --border:rgba(30,60,120,0.10); --border-strong:rgba(30,60,120,0.22);
    --text-1:#132043; --text-2:#54628c; --text-3:#8b96b8;
    --accent:#0d9488; --accent-2:#2563eb; --accent-purple:#7c3aed; --accent-amber:#d97706;
    --glow-blue: 0 4px 20px rgba(37,99,235,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg-0);color:var(--text-1);min-height:100vh;transition:background .3s,color .3s;}

  #authOverlay{position:fixed;inset:0;background:var(--bg-0);z-index:2000;display:flex;align-items:center;justify-content:center;}
  .auth-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;max-width:90vw;box-shadow:var(--glow-blue);}
  .auth-box h2{margin:0 0 4px;color:var(--accent);font-size:20px;}
  .auth-box .sub{color:var(--text-2);font-size:12.5px;margin-bottom:18px;}
  .auth-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-1);color:var(--text-1);font-size:14px;box-sizing:border-box;}
  .auth-box button{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;font-weight:700;cursor:pointer;font-family:var(--font);}
  .auth-error{color:#f87171;font-size:12px;margin-bottom:8px;min-height:16px;}

  #appShell{display:none;min-height:100vh;}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);}
  .topbar .logo{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;}
  .topbar .logo img{width:100%;height:100%;object-fit:contain;}
  .topbar .title{font-weight:700;font-size:15px;}
  .topbar .sub{font-size:11px;color:var(--text-2);}
  .topbar .spacer{flex:1;}
  .topbar a{color:var(--text-2);text-decoration:none;font-size:12.5px;margin-right:14px;}
  .theme-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--bg-1);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--text-2);}
  .topbar button{background:transparent;border:1px solid var(--border);color:var(--text-2);font-size:11px;padding:5px 12px;border-radius:999px;cursor:pointer;margin-left:8px;}

  .layout{display:flex;min-height:calc(100vh - 57px);}
  .sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:16px 10px;}
  .sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:4px;}
  .sidebar-item:hover{background:var(--card-hover);}
  .sidebar-item.active{background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;}

  .main{flex:1;padding:22px 28px;overflow-x:auto;}
  .main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .main-title{font-size:20px;font-weight:700;}
  .main-sub{font-size:12.5px;color:var(--text-2);margin-top:2px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters input, .filters select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-1);color:var(--text-1);font-size:12.5px;font-family:var(--font);}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-1);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);}
  .btn.primary{background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#04101f;border:none;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden;}
  .pagination-bar{display:flex;align-items:center;gap:14px;justify-content:center;padding:14px 0;color:var(--text-2);font-size:13px;}
  .pagination-bar button:disabled{opacity:.4;cursor:not-allowed;}
  table.data-table th{text-align:left;padding:10px 12px;background:var(--bg-1);color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  table.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
  table.data-table tr:last-child td{border-bottom:none;}
  table.data-table tr.clickable{cursor:pointer;}
  table.data-table tr.clickable:hover{background:var(--card-hover);}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;}
  .status-draft{background:rgba(139,155,196,0.2);color:var(--text-2);}
  .status-submitted{background:rgba(245,185,79,0.2);color:var(--accent-amber);}
  .status-approved{background:rgba(79,216,196,0.2);color:var(--accent);}
  .status-done{background:rgba(167,139,250,0.2);color:var(--accent-purple);}
  .status-disapproved{background:rgba(224,90,90,0.2);color:#e05a5a;}
  .status-disbursed{background:rgba(94,150,255,0.2);color:var(--accent-2);}
  .status-completed{background:rgba(167,139,250,0.2);color:var(--accent-purple);}
  .form-badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .form-badge.scf{background:rgba(79,216,196,0.15);color:var(--accent);}
  .form-badge.otcf{background:rgba(94,150,255,0.15);color:var(--accent-2);}
  .empty-note{text-align:center;padding:40px;color:var(--text-2);font-size:13px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;align-items:center;justify-content:center;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:600px;max-width:92vw;max-height:82vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 14px;color:var(--accent);}
  .modal-close{float:right;cursor:pointer;color:var(--text-2);font-size:18px;}
  .detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{color:var(--text-2);}
  .line-items-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
  .line-items-table th,.line-items-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
</style>
</head>
<body data-theme="dark">

<div id="authOverlay">
  <div class="auth-box">
    <h2>MEG-FORMS Admin</h2>
    <div class="sub">Sign in with an admin account to continue</div>
    <div class="auth-error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="doSignIn()">Sign In</button>
    <div class="version-stamp" style="margin-top:20px;font-size:11px;color:#889;text-align:center;">DB-MEG-FORMS-ADMIN v2026.08.22-10:15</div>
  </div>
</div>

<div id="appShell">
  <div class="topbar">
    <div class="logo"><img id="logoImg" src=""></div>
    <div>
      <div class="title">MEG-FORMS Admin</div>
      <div class="sub">Cross-form submissions</div>
    </div>
    <div class="spacer"></div>
    <a href="https://myedengp01.github.io/DB-MEG-FORMS/">← Back to Dashboard</a>
    <div class="theme-toggle" onclick="toggleTheme()"><span id="themeLabel">Dark</span> 🌙</div>
    <button onclick="doSignOut()">Sign Out</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-item active" data-scope="all" onclick="selectScope('all')">📊 All Submissions</div>
      <div id="sidebarFormItems"></div>
    </div>

    <div class="main">
      <div class="main-header">
        <div>
          <div class="main-title" id="mainTitle">All Submissions</div>
          <div class="main-sub" id="mainSub">Loading...</div>
        </div>
        <button class="btn primary" onclick="exportCsv()">⬇️ Export CSV</button>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search claimant name..." oninput="applyFilters()">
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="submitted">Submitted</option>
          <option value="approved">Approved</option>
          <option value="disbursed">Disbursed</option>
          <option value="done">Done</option>
          <option value="completed">Completed</option>
          <option value="disapproved">Disapproved</option>
        </select>
        <input type="date" id="dateFrom" onchange="applyFilters()">
        <span style="color:var(--text-2);font-size:12px;">to</span>
        <input type="date" id="dateTo" onchange="applyFilters()">
        <button class="btn" onclick="clearFilters()">Clear Filters</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;margin-left:8px;">
          <input type="checkbox" id="showDeletedToggle" onchange="loadSubmissions()"> Show Deleted
        </label>
      </div>

      <div id="bulkActionsBar" style="display:none;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px;">
        <span id="bulkSelectedCount" style="font-weight:600;color:var(--text-1);"></span>
        <button class="btn" onclick="bulkMarkAsDone()">✔ Mark Selected as Done</button>
        <button class="btn" style="color:#e05a5a;" onclick="bulkDeleteSelected()">🗑 Delete Selected</button>
        <button class="btn" onclick="selectedIds.clear();renderTable();" style="margin-left:auto;">Clear Selection</button>
      </div>
      <div id="tableWrap"><div class="empty-note">Loading submissions...</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeDetailModal()">✕</span>
    <h3 id="detailTitle">Submission Detail</h3>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="max-width:440px;">
    <span class="modal-close" onclick="closeDeleteModal()">✕</span>
    <h3>Delete Submission(s)</h3>
    <p id="deleteModalSummary" style="color:var(--text-2);font-size:13.5px;"></p>
    <div style="margin:16px 0;">
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;cursor:pointer;">
        <input type="radio" name="deleteType" value="soft" checked style="margin-top:3px;">
        <span><strong>Soft delete</strong> — hidden from the normal view, recoverable later via "Show Deleted"</span>
      </label>
      <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;">
        <input type="radio" name="deleteType" value="hard" style="margin-top:3px;">
        <span><strong>Hard delete</strong> — permanently removed from the database, cannot be undone</span>
      </label>
    </div>
    <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-2);">Confirm your own password to proceed:</label>
    <input type="password" id="deletePasswordInput" placeholder="Your account password" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;box-sizing:border-box;background:var(--card);color:var(--text-1);">
    <div id="deleteErrorMsg" style="color:#e05a5a;font-size:12.5px;min-height:16px;margin-bottom:8px;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn" id="deleteConfirmBtn" style="background:#e05a5a;color:#fff;" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

function toggleTheme(){
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
  localStorage.setItem('meg_forms_theme', isDark ? 'light' : 'dark');
}
function applyStoredTheme(){
  if(localStorage.getItem('meg_forms_theme') === 'light'){
    document.body.setAttribute('data-theme','light');
    document.getElementById('themeLabel').textContent = 'Light';
  }
}

async function doSignIn(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; return; }
  await init();
}
async function doSignOut(){
  await sb.auth.signOut();
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

async function init(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return; }
  currentUser = user;

  const { data: perms } = await sb.from('form_permissions').select('form_code').eq('user_id', user.id).eq('is_admin', true);
  adminFormCodes = (perms||[]).map(p=>p.form_code);

  if(adminFormCodes.length === 0){
    document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('loginError').textContent = 'This account has no admin access on any form.';
    await sb.auth.signOut();
    return;
  }

  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';

  const { data: registry } = await sb.from('form_registry').select('*').in('form_code', adminFormCodes).order('sort_order');
  formRegistry = registry || [];
  const sidebarEl = document.getElementById('sidebarFormItems');
  sidebarEl.innerHTML = (registry||[]).map(f=>
    `<div class="sidebar-item" data-scope="${f.form_code}" onclick="selectScope('${f.form_code}')">${f.icon||'📄'} ${escapeHtmlAdmin(f.display_name)}</div>`
  ).join('');

  await loadSubmissions();
}

async function loadSubmissions(){
  document.getElementById('tableWrap').innerHTML = '<div class="empty-note">Loading submissions...</div>';
  const { data, error } = await sb.from('all_submissions_view').select('*').order('submitted_at', { ascending:false, nullsFirst:false });
  if(error){
    console.error(error);
    document.getElementById('tableWrap').innerHTML = '<div class="empty-note">Failed to load submissions.</div>';
    return;
  }
  const showDeleted = document.getElementById('showDeletedToggle')?.checked || false;
  allRows = (data||[]).filter(r => adminFormCodes.includes(r.form_code) && (showDeleted || !r.deleted_at));
  applyFilters();
}

// Different forms' underlying tables use different column names for their
// "done" state (scf/otcf use status='approved' + approved_at/approved_by_name;
// tec-v2 uses status='done' + done_at/done_by_name) — this maps form_code to
// the right table and column names so bulk actions can route correctly.
const FORM_TABLE_MAP = {
  scf: { table: 'scf_submissions', doneStatus: 'approved', statusCol: 'status', doneAtCol: 'approved_at', doneByNameCol: 'approved_by_name' },
  otcf: { table: 'otcf_submissions', doneStatus: 'approved', statusCol: 'status', doneAtCol: 'approved_at', doneByNameCol: 'approved_by_name' },
  'tec-v2': { table: 'tec_v2_submissions', doneStatus: 'done', statusCol: 'status', doneAtCol: 'done_at', doneByNameCol: 'done_by_name' },
  tec: { table: 'tec_submissions', doneStatus: 'done', statusCol: 'status', doneAtCol: 'done_at', doneByNameCol: 'done_by_name' }
};

async function bulkMarkAsDone(){
  if(selectedIds.size === 0) return;
  if(!confirm(`Mark ${selectedIds.size} selected submission(s) as done/approved?`)) return;
  const selectedRows = allRows.filter(r => selectedIds.has(r.id));
  let successCount = 0, failCount = 0;
  for(const row of selectedRows){
    const map = FORM_TABLE_MAP[row.form_code];
    if(!map){ failCount++; continue; }
    const update = { [map.statusCol]: map.doneStatus, [map.doneAtCol]: new Date().toISOString(), [map.doneByNameCol]: currentUser.email };
    const { error } = await sb.from(map.table).update(update).eq('id', row.id);
    if(error){ console.error(error); failCount++; } else successCount++;
  }
  alert(`${successCount} updated${failCount ? `, ${failCount} failed` : ''}.`);
  selectedIds.clear();
  await loadSubmissions();
}

let pendingDeleteIds = []; // set when the delete modal opens, read by confirmDelete

function bulkDeleteSelected(){
  if(selectedIds.size === 0) return;
  pendingDeleteIds = [...selectedIds];
  document.getElementById('deleteModalSummary').textContent =
    `You're about to delete ${pendingDeleteIds.length} submission${pendingDeleteIds.length===1?'':'s'}. Choose how, then confirm your password.`;
  document.getElementById('deletePasswordInput').value = '';
  document.getElementById('deleteErrorMsg').textContent = '';
  document.querySelector('input[name="deleteType"][value="soft"]').checked = true;
  document.getElementById('deleteModal').style.display = 'flex';
}
function closeDeleteModal(){
  document.getElementById('deleteModal').style.display = 'none';
  pendingDeleteIds = [];
}

async function confirmDelete(){
  const password = document.getElementById('deletePasswordInput').value;
  const errorEl = document.getElementById('deleteErrorMsg');
  if(!password){ errorEl.textContent = 'Enter your password to continue.'; return; }

  const btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true; btn.textContent = 'Verifying...';

  // Re-authenticate with the CURRENTLY signed-in admin's own credentials —
  // this proves it's really her, right now, before an irreversible action;
  // it's not a way to sign in as anyone else.
  const { error: authError } = await sb.auth.signInWithPassword({ email: currentUser.email, password });
  if(authError){
    errorEl.textContent = 'Incorrect password.';
    btn.disabled = false; btn.textContent = 'Delete';
    return;
  }

  const deleteType = document.querySelector('input[name="deleteType"]:checked').value;
  const rowsToDelete = allRows.filter(r => pendingDeleteIds.includes(r.id));
  let successCount = 0, failCount = 0;

  for(const row of rowsToDelete){
    const map = FORM_TABLE_MAP[row.form_code];
    if(!map){ failCount++; continue; }
    let error;
    if(deleteType === 'soft'){
      ({ error } = await sb.from(map.table).update({ deleted_at: new Date().toISOString(), deleted_by_name: currentUser.email }).eq('id', row.id));
    } else {
      ({ error } = await sb.from(map.table).delete().eq('id', row.id));
    }
    if(error){ console.error(error); failCount++; } else successCount++;
  }

  btn.disabled = false; btn.textContent = 'Delete';
  closeDeleteModal();
  selectedIds.clear();
  alert(`${successCount} ${deleteType === 'soft' ? 'soft-deleted' : 'permanently deleted'}${failCount ? `, ${failCount} failed` : ''}.`);
  await loadSubmissions();
}

async function restoreRow(formCode, id){
  if(!confirm('Restore this submission back to the normal view?')) return;
  const map = FORM_TABLE_MAP[formCode];
  if(!map) return;
  const { error } = await sb.from(map.table).update({ deleted_at: null, deleted_by_name: null }).eq('id', id);
  if(error){ alert('Failed to restore: ' + error.message); return; }
  await loadSubmissions();
}

function selectScope(scope){
  currentScope = scope;
  document.querySelectorAll('.sidebar-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.scope === scope);
  });
  document.getElementById('mainTitle').textContent = scope==='all' ? 'All Submissions' : (document.querySelector(`.sidebar-item[data-scope="${scope}"]`)?.textContent.trim() || scope);
  applyFilters();
}

function applyFilters(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;

  filteredRows = allRows.filter(r=>{
    if(currentScope !== 'all' && r.form_code !== currentScope) return false;
    if(search && !(r.claimant_name||'').toLowerCase().includes(search)) return false;
    if(status && r.status !== status) return false;
    if(from && (!r.submitted_at || r.submitted_at.slice(0,10) < from)) return false;
    if(to && (!r.submitted_at || r.submitted_at.slice(0,10) > to)) return false;
    return true;
  });

  document.getElementById('mainSub').textContent = `${filteredRows.length} submission${filteredRows.length===1?'':'s'}`;
  currentPage = 1; // filters changed the result set — always land back on page 1
  selectedIds.clear();
  renderTable();
}
function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  applyFilters();
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function fmtAmount(row){
  if(row.amount===null || row.amount===undefined) return '—';
  return row.amount_unit==='RM' ? `RM ${Number(row.amount).toFixed(2)}` : `${Number(row.amount)} hrs`;
}
function escapeHtmlAdmin(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sortRows(rows){
  const col = sortColumn;
  const dir = sortDirection === 'asc' ? 1 : -1;
  return [...rows].sort((a,b) => {
    let av = a[col], bv = b[col];
    if(col === 'amount'){ av = Number(av)||0; bv = Number(bv)||0; }
    else { av = (av||'').toString().toLowerCase(); bv = (bv||'').toString().toLowerCase(); }
    if(av < bv) return -1 * dir;
    if(av > bv) return 1 * dir;
    return 0;
  });
}
function toggleSort(col){
  if(sortColumn === col){ sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'; }
  else { sortColumn = col; sortDirection = 'asc'; }
  currentPage = 1;
  renderTable();
}
function sortIndicator(col){
  if(sortColumn !== col) return '';
  return sortDirection === 'asc' ? ' ▲' : ' ▼';
}

function computeTotals(rows){
  // Grouped by unit rather than one combined sum — RM and hrs (OTCF) can't
  // be meaningfully added together, so each unit gets its own subtotal.
  const totals = {};
  rows.forEach(r => {
    if(r.amount === null || r.amount === undefined) return;
    const unit = r.amount_unit || '';
    totals[unit] = (totals[unit] || 0) + Number(r.amount);
  });
  return Object.entries(totals)
    .map(([unit, sum]) => unit === 'RM' ? `RM ${sum.toFixed(2)}` : `${sum} ${unit}`)
    .join('  ·  ');
}

function toggleRowSelect(id, checked, event){
  event.stopPropagation(); // don't also trigger the row's own click-to-open-detail
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkActionsBar();
}
function toggleSelectAllOnPage(checked, pageRows){
  pageRows.forEach(r => { if(checked) selectedIds.add(r.id); else selectedIds.delete(r.id); });
  renderTable();
}
function updateBulkActionsBar(){
  const bar = document.getElementById('bulkActionsBar');
  if(!bar) return;
  if(selectedIds.size === 0){
    bar.style.display = 'none';
  } else {
    bar.style.display = 'flex';
    document.getElementById('bulkSelectedCount').textContent = `${selectedIds.size} selected`;
  }
}

function renderTable(){
  const wrap = document.getElementById('tableWrap');
  if(filteredRows.length === 0){
    wrap.innerHTML = '<div class="empty-note">No submissions match the current filters.</div>';
    return;
  }

  const sorted = sortRows(filteredRows);
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageRows = sorted.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  const allOnPageSelected = pageRows.length > 0 && pageRows.every(r => selectedIds.has(r.id));

  const columns = [
    ['claimant_name', 'Claimant'], ['form_code', 'Form'], ['serial_no', 'Serial No.'],
    ['amount', 'Amount'], ['status', 'Status'], ['submitted_at', 'Submitted'],
    ['approved_at', 'Approved'], ['approved_by_name', 'Approved By']
  ];

  wrap.innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th style="width:34px;"><input type="checkbox" ${allOnPageSelected ? 'checked' : ''} onclick="toggleSelectAllOnPage(this.checked, ${JSON.stringify(pageRows.map(r=>r.id))})"></th>
        ${columns.map(([col,label]) => `<th style="cursor:pointer;user-select:none;" onclick="toggleSort('${col}')">${label}${sortIndicator(col)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${pageRows.map(r=>`
          <tr class="clickable" onclick="${r.deleted_at ? '' : `openDetailModal('${r.form_code}','${r.id}')`}" style="${r.deleted_at ? 'opacity:.55;' : ''}">
            <td><input type="checkbox" ${selectedIds.has(r.id) ? 'checked' : ''} onclick="toggleRowSelect('${r.id}', this.checked, event)"></td>
            <td>${escapeHtmlAdmin(r.claimant_name)}</td>
            <td><span class="form-badge ${r.form_code}">${r.form_code.toUpperCase()}</span></td>
            <td>${escapeHtmlAdmin(r.serial_no)}</td>
            <td>${fmtAmount(r)}</td>
            <td>${r.deleted_at
                ? `<span class="status-pill" style="background:rgba(224,90,90,0.2);color:#e05a5a;">DELETED</span> <a href="#" onclick="event.stopPropagation();restoreRow('${r.form_code}','${r.id}')" style="font-size:12px;">Restore</a>`
                : `<span class="status-pill status-${r.status}">${r.status.toUpperCase()}</span>`}</td>
            <td>${fmtDate(r.submitted_at)}</td>
            <td>${fmtDate(r.approved_at)}</td>
            <td>${escapeHtmlAdmin(r.approved_by_name) || '—'}</td>
          </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td colspan="3" style="text-align:right;font-weight:600;">Total (this filtered view):</td>
        <td colspan="6" style="font-weight:600;">${computeTotals(filteredRows) || '—'}</td>
      </tr></tfoot>
    </table>
    ${totalPages > 1 ? `
    <div class="pagination-bar">
      <button class="btn" ${currentPage<=1?'disabled':''} onclick="currentPage--;renderTable();">← Prev</button>
      <span>Page ${currentPage} of ${totalPages}  (${sorted.length} total)</span>
      <button class="btn" ${currentPage>=totalPages?'disabled':''} onclick="currentPage++;renderTable();">Next →</button>
    </div>` : ''}`;

  updateBulkActionsBar();
}

async function openDetailModal(formCode, id){
  if(formCode === 'tec-v2'){
    // Multi-page structure doesn't fit this modal's flat-record design —
    // MEG-TEC-V2 already has its own full-featured read-only review screen
    // (with print support), so open that instead of duplicating it here.
    const form = formRegistry.find(f => f.form_code === 'tec-v2');
    if(form?.url){
      window.open(`${form.url}?review=${id}`, '_blank', 'noopener');
    } else {
      alert('MEG-TEC-V2 URL not found in form_registry.');
    }
    return;
  }
  if(formCode === 'tec'){
    // MEG-TEC V1 already has its own review-mode screen (?review=<id>),
    // same pattern as tec-v2 — open that instead of a third bespoke modal.
    const form = formRegistry.find(f => f.form_code === 'tec');
    if(form?.url){
      window.open(`${form.url}?review=${id}`, '_blank', 'noopener');
    } else {
      alert('MEG-TEC URL not found in form_registry.');
    }
    return;
  }
  if(formCode === 'prfaf'){
    // PRFAF submissions carry line items plus a multi-stage approval /
    // disbursement / reconciliation flow — same reasoning as tec-v2/tec,
    // so open PRFAF's own review screen instead of a fourth bespoke modal.
    const form = formRegistry.find(f => f.form_code === 'prfaf');
    if(form?.url){
      window.open(`${form.url}?review=${id}`, '_blank', 'noopener');
    } else {
      alert('MEG-PRFAF URL not found in form_registry.');
    }
    return;
  }
  document.getElementById('detailModal').style.display = 'flex';
  document.getElementById('detailTitle').textContent = 'Loading...';
  document.getElementById('detailContent').innerHTML = '';
  const table = formCode==='scf' ? 'scf_submissions' : formCode==='mtcf' ? 'mtcf_submissions' : 'otcf_submissions';
  const { data, error } = await sb.from(table).select('*').eq('id', id).single();
  if(error || !data){ document.getElementById('detailContent').innerHTML = '<div class="empty-note">Failed to load detail.</div>'; return; }
  document.getElementById('detailTitle').textContent = `${formCode.toUpperCase()} — ${data.serial_no}`;

  let rows = '';
  if(formCode==='scf'){
    rows = `
      <div class="detail-row"><span class="detail-label">Claimed By</span><span>${escapeHtmlAdmin(data.claimed_by)}</span></div>
      <div class="detail-row"><span class="detail-label">Company</span><span>${escapeHtmlAdmin(data.company_code)}</span></div>
      <div class="detail-row"><span class="detail-label">Period</span><span>${escapeHtmlAdmin(data.period_from)} - ${escapeHtmlAdmin(data.period_to)} ${escapeHtmlAdmin(data.period_year)}</span></div>
      <div class="detail-row"><span class="detail-label">Payment Method</span><span>${escapeHtmlAdmin(data.payment_method)}</span></div>
      <div class="detail-row"><span class="detail-label">Bank</span><span>${escapeHtmlAdmin(data.bank_name)} - ${escapeHtmlAdmin(data.bank_account_no)}</span></div>
      <div class="detail-row"><span class="detail-label">Total</span><span>RM ${Number(data.total).toFixed(2)}</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="status-pill status-${data.status}">${data.status.toUpperCase()}</span></div>
      <table class="line-items-table">
        <thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Amount</th></tr></thead>
        <tbody>${(data.line_items||[]).map(li=>`<tr><td>${escapeHtmlAdmin(li.date)}</td><td>${escapeHtmlAdmin(li.supplier)}</td><td>${escapeHtmlAdmin(li.item)}</td><td>${Number(li.amount||0).toFixed(2)}</td></tr>`).join('')}</tbody>
      </table>`;
  } else if(formCode==='mtcf'){
    const disapprovalRow = data.status === 'disapproved'
      ? `<div class="detail-row"><span class="detail-label">Disapproval Reason</span><span>${escapeHtmlAdmin(data.disapproval_reason) || '—'}</span></div>`
      : '';
    rows = `
      <div class="detail-row"><span class="detail-label">Claimant</span><span>${escapeHtmlAdmin(data.claimant_name)}</span></div>
      <div class="detail-row"><span class="detail-label">Company</span><span>${escapeHtmlAdmin(data.company_code)}</span></div>
      <div class="detail-row"><span class="detail-label">Period</span><span>${escapeHtmlAdmin(data.start_date)} - ${escapeHtmlAdmin(data.end_date)}</span></div>
      <div class="detail-row"><span class="detail-label">Rate (RM/KM)</span><span>${Number(data.rate_rm_per_km||0).toFixed(2)}</span></div>
      <div class="detail-row"><span class="detail-label">Total Mileage</span><span>${Number(data.total_mileage_km||0).toFixed(2)} KM</span></div>
      <div class="detail-row"><span class="detail-label">Total Amount</span><span>RM ${Number(data.total_amount||0).toFixed(2)}</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="status-pill status-${data.status}">${data.status.toUpperCase()}</span></div>
      <div class="detail-row"><span class="detail-label">Approval Token</span><span>${escapeHtmlAdmin(data.approval_token) || '—'}</span></div>
      ${disapprovalRow}
      <table class="line-items-table">
        <thead><tr><th>Date</th><th>Purpose</th><th>Start</th><th>End</th><th>KM</th><th>Remarks</th></tr></thead>
        <tbody>${(data.trips||[]).map(t=>`<tr><td>${escapeHtmlAdmin(t.date)}</td><td>${escapeHtmlAdmin(t.purpose)}</td><td>${escapeHtmlAdmin(t.start_location)}</td><td>${escapeHtmlAdmin(t.end_location)}</td><td>${Number(t.distance_km||0).toFixed(1)}</td><td>${escapeHtmlAdmin(t.remarks)}</td></tr>`).join('')}</tbody>
      </table>`;
  } else {
    rows = `
      <div class="detail-row"><span class="detail-label">Employee</span><span>${escapeHtmlAdmin(data.emp_name)}</span></div>
      <div class="detail-row"><span class="detail-label">Department</span><span>${escapeHtmlAdmin(data.department)}</span></div>
      <div class="detail-row"><span class="detail-label">Designation</span><span>${escapeHtmlAdmin(data.designation)}</span></div>
      <div class="detail-row"><span class="detail-label">Month/Year</span><span>${data.month}/${data.year}</span></div>
      <div class="detail-row"><span class="detail-label">Total Hours</span><span>${data.total_hours} hrs</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="status-pill status-${data.status}">${data.status.toUpperCase()}</span></div>
      <div class="detail-row"><span class="detail-label">Approval Token</span><span>${escapeHtmlAdmin(data.approval_token) || '—'}</span></div>
      <table class="line-items-table">
        <thead><tr><th>Date</th><th>Day</th><th>Claim Type</th><th>From</th><th>To</th><th>Hrs</th></tr></thead>
        <tbody>${(data.line_items||[]).map(li=>`<tr><td>${escapeHtmlAdmin(li.date)}</td><td>${escapeHtmlAdmin(li.day)}</td><td>${escapeHtmlAdmin(li.claimType)}</td><td>${escapeHtmlAdmin(li.from)}</td><td>${escapeHtmlAdmin(li.to)}</td><td>${escapeHtmlAdmin(li.totalHrs)}</td></tr>`).join('')}</tbody>
      </table>`;
  }
  document.getElementById('detailContent').innerHTML = rows;
}
function closeDetailModal(){ document.getElementById('detailModal').style.display = 'none'; }

function exportCsv(){
  if(filteredRows.length === 0){ alert('No rows to export.'); return; }
  const headers = ['Claimant','Form','Serial No','Amount','Unit','Status','Submitted','Approved','Approved By'];
  const csvRows = [headers.join(',')];
  filteredRows.forEach(r=>{
    const row = [
      csvEscape(r.claimant_name), r.form_code.toUpperCase(), csvEscape(r.serial_no),
      r.amount ?? '', r.amount_unit, r.status, fmtDate(r.submitted_at), fmtDate(r.approved_at),
      csvEscape(r.approved_by_name || '')
    ];
    csvRows.push(row.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MEG-FORMS-Submissions-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function csvEscape(s){
  s = String(s||'');
  if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

  const { data: { session } } = await sb.auth.getSession();

};
